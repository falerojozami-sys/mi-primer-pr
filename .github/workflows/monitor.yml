name: Monitor convocatorias JND

on:
  schedule:
    # Cada 3 horas. Hora UTC (Uruguay es UTC-3).
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar convocatorias nuevas
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python jnd_monitor.py

      - name: Guardar estado si cambió
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "jnd-monitor"
            git config user.email "jnd-monitor@users.noreply.github.com"
            git add seen.json
            git commit -m "Actualizar convocatorias vistas"
            git push
          fi
